amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan

    laser_model_type: likelihood_field

    laser_min_range: -1.0
    laser_max_range: 100.0
    laser_likelihood_max_dist: 2.0

    min_particles: 500
    max_particles: 2000

    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.20
    update_min_a: 0.20

    transform_tolerance: 1.0

    resample_interval: 1

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    tf_broadcast: true

    do_beamskip: false

    set_initial_pose: false


map_server:
  ros__parameters:
    use_sim_time: true
    


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 10.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      tolerance: 0.5
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.3

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.5

      min_vel_y: 0.0
      max_vel_y: 0.0

      min_vel_theta: -1.0
      max_vel_theta: 1.0

      min_speed_xy: 0.0
      max_speed_xy: 0.5

      min_speed_theta: 0.0
      max_speed_theta: 1.0

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      xy_goal_tolerance: 0.20

      trans_stopped_velocity: 0.1

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist


behavior_server:
  ros__parameters:
    use_sim_time: true

    global_frame: odom
    robot_base_frame: base_footprint

    transform_tolerance: 0.1

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint

    odom_topic: /odom

    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: true

      waypoint_pause_duration: 0


global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05

      track_unknown_space: true

      robot_radius: 0.25

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true

        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan

          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 8.0
          obstacle_min_range: 0.0

          raytrace_max_range: 8.0
          raytrace_min_range: 0.0

          max_obstacle_height: 2.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.55

        cost_scaling_factor: 3.0


local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true

      width: 3
      height: 3

      resolution: 0.05

      robot_radius: 0.25

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan

          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 8.0
          obstacle_min_range: 0.0

          raytrace_max_range: 8.0
          raytrace_min_range: 0.0

          max_obstacle_height: 2.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.55

        cost_scaling_factor: 3.0


lifecycle_manager_localization:
  ros__parameters:

    use_sim_time: true

    autostart: true

    node_names:
      - map_server
      - amcl

    bond_timeout: 4.0


lifecycle_manager_navigation:
  ros__parameters:

    use_sim_time: true

    autostart: true

    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower

    bond_timeout: 4.0